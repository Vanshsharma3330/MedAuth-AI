# This file is for Model names, temperatures and RAG parameters for every agent

information_extraction_agent:
  model: "llama-3.1-8b-instant"
  temperature: 0.0

risk_agent:
  model: "llama-3.1-8b-instant"
  temperature: 0.0

verification_agent:
  model: "llama-3.1-8b-instant"
  temperature: 0.0

peer_review_agent:
  model: "llama-3.1-8b-instant"
  temperature: 0.0

decision_agent:
  model: "llama-3.1-8b-instant"
  temperature: 0.0

translation_agent:
  model: "llama-3.1-8b-instant"
  temperature: 0.0

rag_indexing_agent:
  embedding_model: "all-MiniLM-L6-v2"
  chunk_size: 256
  chunk_overlap: 64

rag_retrieval_agent:
  embedding_model: "all-MiniLM-L6-v2"
  top_k: 5

rag_augmentation_agent:
  model: "llama-3.1-8b-instant"
  temperature: 0.0
  min_score: 0.3
  max_chunks: 5

rag_generation_agent:
  model: "llama-3.1-8b-instant"
  temperature: 0.2
  max_tool_calls: 4
  history_returns: 6

rag_reflection_agent:
  model: "llama-3.1-8b-instant"
  temperature: 0.0
  min_answer_relevance: 0.60
  min_groundedness: 0.60
  min_context_relevance: 0.60